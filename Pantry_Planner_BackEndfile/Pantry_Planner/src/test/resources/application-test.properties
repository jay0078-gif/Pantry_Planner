spring.datasource.url=jdbc:h2:mem:pantry-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=OFF

app.cors.allowed-origins=https://jay0078-gif.github.io
app.jwt.secret=test-only-secret-with-at-least-32-characters
app.jwt.issuer=pantry-planner
app.jwt.audience=pantry-planner-web
app.jwt.ttl=PT30M
app.seed.owner-password=test-owner-password
app.seed.user-password=
photos.backfill-on-start=false
