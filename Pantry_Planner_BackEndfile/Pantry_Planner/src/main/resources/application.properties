# -------------------------------------------------------------------
#  Application Identity
# -------------------------------------------------------------------
spring.application.name=Pantry_Planner

# -------------------------------------------------------------------
#  Logging Levels
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.main=DEBUG
logging.level.org.springframework.security=INFO
# Uncomment this if debugging CORS or auth issues
# logging.level.org.springframework.web.cors=TRACE
# logging.level.org.springframework.security.web.authentication=TRACE
# in application.properties
logging.level.io.netty.resolver.dns=ERROR
# -------------------------------------------------------------------
#  Database (MySQL)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/pantry?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Jay9558@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
#  Hibernate / JPA options
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update 
#spring.jpa.hibernate.ddl-auto=update
# use validate in production
  # use validate in production
#spring.jpa.show-sql=false           
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
#  Server error output (integrates nicely with RestExceptionHandler)
# -------------------------------------------------------------------
#server.error.include-message=never
#server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

server.error.include-message=always
server.error.include-stacktrace=always
spring.jpa.show-sql=true

# -------------------------------------------------------------------
#  Session / Cookie  (allows sharing login session with your React app)
# -------------------------------------------------------------------
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
spring.mvc.throw-exception-if-no-handler-found=false
# -------------------------------------------------------------------
#  Server Port
# -------------------------------------------------------------------
server.port=8080

# -------------------------------------------------------------------
#  Optional Photo / Pexels Integration
# -------------------------------------------------------------------
pexels.apiKey=DDKkPy9DwX69YM6fMGz0HREaLEgURW1oshUYw1wvlwosYtU6AEIyzs7C
photos.fallback=/images/food-fallback.png
photos.backfill-on-start=true




