spring.application.name=Pantry_Planner
spring.config.import=optional:file:./.env[.properties]

logging.level.root=INFO
logging.level.com.main=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/pantry?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DATABASE_VALIDATION_TIMEOUT_MS:5000}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}
server.error.include-stacktrace=${SERVER_ERROR_INCLUDE_STACKTRACE:never}
server.error.whitelabel.enabled=false
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.db.enabled=true

pexels.apiKey=${PEXELS_API_KEY:}
pexels.backfill-reserve=${PEXELS_BACKFILL_RESERVE:25}
photos.fallback=/images/food-fallback.png
photos.backfill.enabled=${PHOTOS_BACKFILL_ENABLED:${PHOTOS_BACKFILL_ON_START:false}}
photos.backfill.batch-size=${PHOTOS_BACKFILL_BATCH_SIZE:100}
photos.backfill.initial-delay=${PHOTOS_BACKFILL_INITIAL_DELAY:PT10S}
photos.backfill.interval=${PHOTOS_BACKFILL_INTERVAL:PT1H}
photos.backfill.not-found-retry=${PHOTOS_BACKFILL_NOT_FOUND_RETRY:PT720H}
photos.backfill.failure-retry=${PHOTOS_BACKFILL_FAILURE_RETRY:PT1H}
photos.backfill.max-failure-retry=${PHOTOS_BACKFILL_MAX_FAILURE_RETRY:PT24H}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:pantry-planner}
app.jwt.audience=${JWT_AUDIENCE:pantry-planner-web}
app.jwt.ttl=${JWT_TTL:PT30M}
app.auth.rate-limit.login.max-attempts=${AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:20}
app.auth.rate-limit.login.window=${AUTH_LOGIN_RATE_LIMIT_WINDOW:PT1M}
app.auth.rate-limit.registration.max-attempts=${AUTH_REGISTRATION_RATE_LIMIT_MAX_ATTEMPTS:5}
app.auth.rate-limit.registration.window=${AUTH_REGISTRATION_RATE_LIMIT_WINDOW:PT1H}
app.auth.trusted-client-ip-header=${AUTH_TRUSTED_CLIENT_IP_HEADER:}
app.seed.owner-password=${SEED_OWNER_PASSWORD:}
app.seed.user-password=${SEED_USER_PASSWORD:}
